# ==============================================================================
# Kitty Terminal Configuration - Catppuccin Macchiato
# ==============================================================================

# -- Fonts ---------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# -- Window Layout -------------------------------------------------------------
remember_window_size   yes
initial_window_width   800
initial_window_height  500
window_padding_width   8
background_opacity     0.85

# -- Cursor --------------------------------------------------------------------
cursor_shape           beam
cursor_beam_thickness  1.5

# -- Colors (Catppuccin Macchiato) ---------------------------------------------
foreground            #cad3f5
background            #24273a
selection_foreground  #24273a
selection_background  #f4dbd6
cursor                #f4dbd6
cursor_text_color     #24273a

# Black
color0 #494d64
color8 #5b6078

# Red
color1 #ed8796
color9 #ed8796

# Green
color2  #a6da95
color10 #a6da95

# Yellow
color3  #eed49f
color11 #eed49f

# Blue
color4  #8aadf4
color12 #8aadf4

# Magenta
color5  #f5bde6
color13 #f5bde6

# Cyan
