# ==============================================================================
# Hyprland Main Configuration - Unified Theme & Monitor Support
# ==============================================================================

# -- Source Dynamic Colors & Monitors -----------------------------------------
source = ~/.config/hypr/current_colors.conf
source = ~/.config/hypr/monitors.conf

# -- Autostart Services --------------------------------------------------------
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = spice-vdagent

# -- Input & Keyboard Layout (Portuguese) --------------------------------------
input {
    kb_layout = pt
    kb_variant =
    kb_model =
    kb_options =
    
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# -- General Appearance & Borders ----------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    
    col.active_border = $active_border_col_1 $active_border_col_2 45deg
    col.inactive_border = $inactive_border_col
    
    layout = dwindle
    allow_tearing = false
}

# -- Window Decoration & Shadows -----------------------------------------------
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = $shadow_col
    }
}

# -- Animations ----------------------------------------------------------------
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# -- Dwindle Layout ------------------------------------------------------------
dwindle {
    preserve_split = true
}

# -- Keybindings ---------------------------------------------------------------
$mainMod = SUPER

# Terminal (Supports both SUPER+Enter and SUPER+Q)
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, exec, kitty

# Window Management
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, exec, costa-utils --clipper
bind = $mainMod, P, exec, costa-utils --power-menu
bind = $mainMod, F, fullscreen,

# costa-utils Launchers & Switchers
bind = $mainMod, R, exec, costa-utils --app-menu
bindr = $mainMod, SUPER_L, exec, costa-utils --app-menu
bind = $mainMod ALT, T, exec, ~/.config/scripts/theme-select
bind = $mainMod ALT, M, exec, ~/.config/scripts/monitor-select

# Move Focus (Vim keys & Arrows)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through Workspaces with mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/Resize Windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
